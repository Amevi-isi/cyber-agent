scenarios:
  ransomware_lockbit:
    name: "Ransomware LockBit Attack"
    description: "Complete ransomware attack lifecycle from initial access to data encryption"
    timeline_minutes: 60
    steps:
      - source: "suricata"
        event: "c2_beaconing"
        offset_minutes: 0
      - source: "wazuh"
        event: "ssh_brute_force"
        offset_minutes: 5
      - source: "wazuh"
        event: "ssh_login_success"
        offset_minutes: 10
      - source: "edr"
        event: "powershell_encoded"
        offset_minutes: 15
      - source: "ad"
        event: "user_created"
        offset_minutes: 20
      - source: "ad"
        event: "privilege_escalation"
        offset_minutes: 25
      - source: "edr"
        event: "malware_download"
        offset_minutes: 30
      - source: "edr"
        event: "malware_execution"
        offset_minutes: 35
      - source: "wazuh"
        event: "file_encryption"
        offset_minutes: 40
      - source: "suricata"
        event: "data_exfiltration"
        offset_minutes: 45
      - source: "fortigate"
        event: "c2_blocked"
        offset_minutes: 50
      - source: "iris"
        event: "case_opened"
        offset_minutes: 55

  phishing_bec:
    name: "Business Email Compromise"
    description: "Phishing attack leading to business email compromise"
    timeline_minutes: 180
