  apt_lateral_movement:
    name: "APT Lateral Movement"
    description: "Advanced persistent threat with lateral movement"
    timeline_minutes: 240
    steps:
      - source: "suricata"
        event: "initial_access"
        offset_minutes: 0
      - source: "edr"
        event: "initial_implant"
        offset_minutes: 15
      - source: "wazuh"
